experiment_id: supply-aware-defensive-attention-v6
status: frozen_before_v6_candidate_evaluation
frozen_date: 2026-07-23
claim_type: new engineered composite, not a new primitive anomaly

candidate_registry:
  - supply_aware_defensive_attention

multiplicity:
  method: Benjamini-Hochberg
  prior_tests_included: 44
  total_tests_after_v6: 45

formula:
  core_components:
    - anti_max_return_20
    - low_turnover_20
    - negative_intraday_mean_20
    - low_volatility_60
    - reversal_20
  core_weights: equal, 0.20 each
  component_transform: eligible-universe 3-MAD winsorization, z-score, clip [-5,5]
  supply_state: remaining_float_inventory_days_025_v6
  supply_penalty: 0.25 * max(-z_supply_state, 0)
  candidate: mean(core_z_scores) minus supply_penalty

neutralization:
  controls:
    - z_log_float_market_cap
    - centered_squared_z_log_float_market_cap
    - Shenwan_L1_dummies

periods:
  discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]
  untouched_asset_disjoint_confirmation: [2020-01-01, 2026-05-31]

