experiment_id: tail-shadow-rejection-asymmetry-v29
status: frozen_before_v29_bucket_e_evaluation
frozen_date: 2026-07-23
research_bucket: E/legacy-liquid-hash-A
claim_type: exact completed-tail-event shadow asymmetry not found in the documented pre-outcome search; candlestick shadows are prior art

candidate_registry: [tsra_60, tsra_90]

formula:
  tail_events: bottom and top 20 percent of eligible-universe market-residual close-to-close log return
  lower_shadow_share: (min(open, close) - low) / (high - low)
  upper_shadow_share: (high - max(open, close)) / (high - low)
  completed_bottom_response: next-session lower-shadow share after a bottom-tail event
  completed_top_response: next-session upper-shadow share after a top-tail event
  candidate: mean completed bottom response minus mean completed top response
  minimum_completed_events_per_tail: 8
  horizons: [60, 90]
  expected_sign: positive

neutralization:
  minimum_rows: 100
  common_controls: eleven registered liquidity, reversal, volatility, lottery, momentum, and overnight/intraday controls
  incremental_controls:
    - corresponding V21 directional range relaxation score
    - bottom-versus-top completed-event balance
    - mean next-session range response after tail events
    - linear tail-residual/range-response correlation
    - mean event-day log range
    - unconditional mean lower-shadow share
    - unconditional mean upper-shadow share
    - unconditional mean body-efficiency share
  structural_controls:
    - z_log_float_market_cap
    - centered_squared_z_log_float_market_cap
    - point_in_time_Shenwan_L1_dummies

prior_art_boundary:
  related_but_not_exact:
    - candlestick-shadow return forecasting
    - return-tail event studies
    - V21 next-day range relaxation
  distinction: >-
    TSRA uses only completed next-session shadow rejection after cross-sectional
    residual tails and removes unconditional shadow geometry plus registered range response.

data_reuse_limitation: E/F were used by an earlier repository for a different formula; V29 is formula-new to both and F remains sealed
adaptive_reuse_disclosure: V29 is a distinct intraday-range geometry mechanism specified after the V26-V27 supply family closed; all prior tests remain in BH

multiplicity:
  method: Benjamini-Hochberg
  prior_tests_included: 80
  current_tests: 2
  total_tests_after_v29: 82

periods:
  discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]

research_gate:
  discovery_minimum_months: 32
  discovery_mean_rank_ic_min: 0.015
  discovery_bh_fdr_max: 0.10
  validation_minimum_months: 23
  validation_mean_rank_ic_min: 0.010
  validation_2023_and_2024_positive: true
  validation_mean_net_active_return_min: 0.0
  validation_net_information_ratio_min: 0.30

portfolio:
  type: buffered equal-weight long-only
  holdings: 100
  retention_percentile: 0.60
  cost_bps_one_way: 20

failure_rule: retain the negative result and keep F sealed if neither candidate passes

