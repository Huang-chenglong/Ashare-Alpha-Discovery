experiment_id: fundamental-structural-interaction-model-v36
status: frozen_before_v36_bucket_e_return_evaluation
frozen_date: 2026-07-23
research_bucket: E/legacy-liquid-hash-A
claim_type: >-
  Original fixed learned composite over established primitive variables. The
  project does not claim that accounting, ownership, or trading-structure
  primitives are new, nor that global exact-formula novelty is proven.

candidate_registry: [fsim_v36]
expected_sign: positive

training:
  discovery_period: [2020-01-01, 2022-12-31]
  asset_crossfit_folds: 5
  fold_assignment: first 64 bits of SHA-256 of the zero-padded asset code modulo 5
  discovery_prediction_rule: >-
    Each 2020-2022 stock-month is predicted only by a model trained on the
    other four asset folds. No held-out asset label enters that fold model's
    target residualization or estimator.
  validation_prediction_rule: >-
    One final model trained on all 2020-2022 rows predicts 2023-2024. No
    2023-2024 label is used in fitting, feature selection, or hyperparameters.
  target: >-
    Next-20-session active return residual after cross-sectional removal of
    fourteen known baselines, log float size, squared log float size, and
    point-in-time Shenwan L1 industry.
  estimator: sklearn.ensemble.HistGradientBoostingRegressor
  fixed_hyperparameters:
    loss: squared_error
    learning_rate: 0.03
    max_iter: 100
    max_leaf_nodes: 7
    min_samples_leaf: 100
    l2_regularization: 10.0
    max_bins: 63
    early_stopping: false
    random_state: 0
  hyperparameter_search: none

