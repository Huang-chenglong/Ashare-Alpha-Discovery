financial_data:
  source: TongdaXin professional quarterly GPCW packages
  fields: union of the frozen V32 and V35 field maps
  point_in_time_rule: announcement-date as-of join; maximum age 183 days
  excluded_shenwan_l1_codes: ["48", "49"]
  pre_outcome_coverage_audit:
    package_count: 33
    parsed_rows: 159246
    complete_joint_quarterly_rows: 122385
    assets: 5388
    report_period: [2019-03-31, 2026-03-31]
    note: calculated without loading or joining any future-return label
  vintage_limitation: >-
    Packages were downloaded in 2026 rather than archived at each formation.
    Announcement gating is enforced, but later corrections or restatements
    cannot be ruled out.

evaluation_neutralization:
  minimum_rows: 300
  controls: >-
    Linear and quadratic terms of all 52 ranked model inputs, 38 explicit
    missing indicators, log float size, centered squared log float size, and
    point-in-time Shenwan L1 dummies.
  interpretation_boundary: >-
    A surviving score is incremental to linear and quadratic ranked marginal
    effects. It is not claimed to remove every possible univariate nonlinear
    function.

multiplicity:
  method: cumulative Benjamini-Hochberg on discovery one-sided HAC p-values
  prior_tests_included: 88
  current_tests: 1
  total_tests_after_v36: 89
  additional_guard: validation one-sided HAC p must be no greater than 0.05

periods:
  cross_fitted_discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]

research_gate:
  discovery_minimum_months: 34
  discovery_mean_rank_ic_min: 0.015
  discovery_bh_fdr_max: 0.10
  validation_minimum_months: 23
  validation_mean_rank_ic_min: 0.010
  validation_2023_and_2024_positive: true
  validation_hac_p_one_sided_max: 0.05
  validation_mean_net_active_return_min: 0.0
  validation_net_information_ratio_min: 0.30

portfolio:
  type: buffered equal-weight long-only
  holdings: 100
  retention_percentile: 0.60
  cost_bps_one_way: 20

prior_art_boundary:
  related_primitives:
    - https://doi.org/10.1016/j.jfineco.2016.03.002
    - https://doi.org/10.1016/j.jfineco.2023.103746
    - https://doi.org/10.1016/j.jom.2013.05.002
    - https://doi.org/10.3386/w8308
  bounded_claim: >-
    V36 is an original pre-frozen learned mapping in this repository, not a
    claim that no equivalent mapping exists anywhere. All primitive families
    and prior failed internal constructions are disclosed.

adaptive_reuse_disclosure: >-
  For this exact frozen model, 2023-2024 is outside model fitting. At the
  project level E has been repeatedly inspected through V35 and is therefore
  adaptively reused internal validation, not a pristine holdout. V36 remains in
  the cumulative 89-test family.
data_reuse_limitation: >-
  F is asset-disjoint and remains sealed. It can be opened once, with a
  separately frozen confirmation protocol, only if V36 passes every research
  gate without any post-outcome change.
failure_rule: >-
  Reject V36 without changing signs, features, folds, transforms,
  hyperparameters, controls, periods, gates, portfolio, or costs and keep F
  sealed if any research gate fails.
