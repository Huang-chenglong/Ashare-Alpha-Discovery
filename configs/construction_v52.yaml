experiment_id: nonlinear-margin-path-model-v52
status: frozen_after_v51_A_failure_before_v52_A_model_outcomes
frozen_date: 2026-07-24

adaptivity_disclosure: >-
  V52 follows V50-V51 bucket-A diagnostics showing a positive overall IC but a
  non-monotone extreme top tail. No bucket-B margin-factor outcome has been
  calculated. V52 replaces manual hump-shaped formula tuning with three
  pre-registered, strongly regularized model classes and point-in-time
  expanding-window prediction.

features:
  margin_interactions: [mdar_v48, mcar_v48, mlcf_v48, mpbr_v50, mpsr_v50, mpcs_v50]
  margin_main_effects:
    - financing_leverage
    - net_financing_flow_to_turnover
    - short_leverage
    - short_sell_intensity
    - path_inflow_breadth
    - path_signed_ratio
    - path_dispersion_ratio
  price_and_volume_main_effects: inherit_v48_known_factor_controls
  normalization: cross_sectional_percentile_rank_each_month
  missing_values: rows_are_excluded_no_imputation

models:
  - candidate: ridge10_v52
    specification: StandardScaler then Ridge(alpha=10)
  - candidate: hgb7_v52
    specification: HistGradientBoostingRegressor(learning_rate=0.05,max_iter=150,max_leaf_nodes=7,min_samples_leaf=80,l2_regularization=10,early_stopping=false,random_state=20260724)
  - candidate: extra4_v52
    specification: ExtraTreesRegressor(n_estimators=300,max_depth=4,min_samples_leaf=50,max_features=0.75,bootstrap=false,random_state=20260724)
candidate_registry: [ridge10_v52, hgb7_v52, extra4_v52]
alternative_models_or_hyperparameters_permitted_after_outcomes: false
sign_flipping_permitted_after_outcomes: false

point_in_time_training:
  construction_prediction_dates: 2021-01-01_to_2023-12-31
  train_rule: only_rows_with_exit_date_strictly_before_prediction_date
  window: expanding
  minimum_training_rows: 2500
  target: next_20_session_open_to_open_return_minus_same_month_research_universe_mean
  final_model_label_cutoff: exit_date_strictly_before_2024-01-01
  confirmation_refitting: none

final_score_neutralization:
  controls: all_v50_price_volume_and_margin_path_main_effects
  size: log_float_market_cap_and_centered_square
  industry: point_in_time_shenwan_level_1
  minimum_rows: 150

