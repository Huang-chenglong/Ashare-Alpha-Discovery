experiment_id: cash-confirmed-reporting-acceleration-v38
status: frozen_before_v38_bucket_e_return_evaluation
frozen_date: 2026-07-23
research_bucket: E/legacy-liquid-hash-A
claim_type: >-
  Exact same-quarter reporting-acceleration/cash-improvement/positive-cash-ROA
  interaction not found in the bounded pre-outcome search. Reporting timeliness
  and cash profitability are established primitives.

candidate_registry: [cora_v38]
expected_sign: positive

formula:
  announcement_lag_days: report announcement date minus fiscal report date
  reporting_acceleration_yoy: >-
    Prior-year same-quarter announcement lag minus current announcement lag.
  component_transform: >-
    Strictly positive reporting acceleration, cash-ROA year-over-year
    improvement, and current cash ROA are separately percentile-ranked within
    each formation date; nonpositive values receive zero.
  candidate: >-
    Positive reporting-acceleration rank multiplied by positive cash-improvement
    rank multiplied by positive cash-ROA rank.
  interpretation: >-
    A firm that reports the same fiscal quarter more promptly while cash
    generation both improves and remains positive provides a joint disclosure
    timeliness and earnings-quality signal.

financial_data:
  source: TongdaXin professional quarterly GPCW packages
  fields:
    col40: total assets
    col307: TTM operating cash flow
    col308: TTM parent net profit in 10k CNY
    col314: report announcement date
  timing_filters:
    announcement_lag_days: [0, 365]
    reporting_acceleration_yoy_days: [-180, 180]
    exact_same_quarter_distance: 4
  point_in_time_rule: current report is usable only on its announcement date
  maximum_signal_age_days: 183
  excluded_shenwan_l1_codes: ["48", "49"]
  pre_outcome_coverage_audit:
    valid_quarterly_rows: 129596
    assets: 5397
    positive_reporting_acceleration_rows: 57546
    positive_cash_improvement_rows: 64151
    positive_cash_roa_rows: 103949
    triple_positive_rows: 26226
    available_period: [2019-04-08, 2026-05-15]
    note: calculated without loading or joining any future-return label
  vintage_limitation: >-
    Packages were downloaded in 2026 rather than archived at each formation.
    Announcement gating is enforced, but later corrections or restatements
    cannot be ruled out.

neutralization:
  minimum_rows: 100
  known_price_volume_controls:
    - low_turnover_20
    - low_turnover_vol_60
    - reversal_20
    - low_volatility_60
    - anti_max_return_20
    - anti_max_return_60
    - anti_skewness_20
    - anti_skewness_60
    - momentum_60_20
    - momentum_120_20
    - overnight_mean_20
    - overnight_mean_60
    - negative_intraday_mean_20
    - negative_intraday_mean_60
  financial_main_effects:
    - positive_reporting_acceleration_rank
    - positive_cash_improvement_rank
    - positive_cash_roa_rank
    - reporting_acceleration_yoy
    - announcement_lag_days
    - prior_year_announcement_lag_days
    - cash_improvement_yoy
    - profitability_improvement_yoy
    - cash_flow_roa
    - profitability_roa
    - cash_accrual_spread
    - asset_growth_yoy
  structural_controls:
    - z_log_float_market_cap
    - centered_squared_z_log_float_market_cap
    - point_in_time_Shenwan_L1_dummies

prior_art_boundary:
  related_but_not_exact:
    - https://doi.org/10.1016/j.jfineco.2016.03.002
    - https://doi.org/10.3386/w8308
    - https://doi.org/10.1111/1911-3846.12116
  bounded_search_result: >-
    Prior work studies reporting delay, disclosure timeliness, cash
    profitability, and earnings quality. The exact registered triple after
    removal of current/prior lag, all accounting components, known factors,
    size, and industry was not found. This is not proof of universal novelty.

multiplicity:
  method: cumulative Benjamini-Hochberg on discovery one-sided HAC p-values
  prior_tests_included: 90
  current_tests: 1
  total_tests_after_v38: 91
  additional_guard: validation one-sided HAC p must be no greater than 0.05

periods:
  discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]

research_gate:
  discovery_minimum_months: 34
  discovery_mean_rank_ic_min: 0.015
  discovery_bh_fdr_max: 0.10
  validation_minimum_months: 23
  validation_mean_rank_ic_min: 0.010
  validation_2023_and_2024_positive: true
  validation_hac_p_one_sided_max: 0.05
  validation_mean_net_active_return_min: 0.0
  validation_net_information_ratio_min: 0.30

portfolio:
  type: buffered equal-weight long-only
  holdings: 100
  retention_percentile: 0.60
  cost_bps_one_way: 20

adaptive_reuse_disclosure: >-
  For the exact V38 formula, 2023-2024 is outside construction. At the project
  level E has been repeatedly inspected through V37 and is adaptively reused
  internal validation, not a pristine holdout. V38 remains in the cumulative
  91-test family.
data_reuse_limitation: >-
  F remains sealed and may be opened once under a separately frozen protocol
  only if V38 passes every research gate without a post-outcome change.
failure_rule: >-
  Reject V38 without changing the sign, fields, lags, ranks, timing bounds,
  age, exclusions, controls, periods, gates, portfolio, or costs and keep F
  sealed if any research gate fails.
