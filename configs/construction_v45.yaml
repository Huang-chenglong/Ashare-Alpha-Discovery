experiment_id: persistent-structural-tail-consensus-v45
status: frozen_before_E_plus_F_construction_outcomes
frozen_date: 2026-07-24

candidates:
  - candidate: pcs70_30_v45
    formula: 0.70 * consensus60_40(t) + 0.30 * consensus60_40(t-1)
    consecutive_months_required: 2
  - candidate: pcs60_25_15_v45
    formula: 0.60 * consensus60_40(t) + 0.25 * consensus60_40(t-1) + 0.15 * consensus60_40(t-2)
    consecutive_months_required: 3
  - candidate: pcg_v45
    formula: consensus60_40(t) * (0.50 + 0.50 * consensus60_40(t-1))
    consecutive_months_required: 2
base_consensus: 0.60 * percentile_rank(rrsm_v43_residual) + 0.40 * percentile_rank(tafs_v42_residual)
hypothesis: >-
  Cross-sectional ordering that persists across consecutive formation months is
  more likely to represent a durable structural/funding state than a transient
  model score. Persistence should preserve monotonic IC while stabilizing the
  tradable top fifty and improving cost-adjusted information ratio.
direction: higher_persistent_consensus_predicts_higher_return

adaptivity_disclosure: >-
  V45 was designed after observing that V44's 60/40 candidate had positive net
  return but narrowly missed the IC and IR floors. E and F are fully consumed
  construction data. V45 earns no out-of-sample claim without one-shot G
  confirmation.

evidence_roles:
  E: adaptive construction data
  F: consumed V41 confirmation data, explicitly converted to V45 construction
  G: sealed formula-unseen asset-disjoint confirmation; no V45 factor or return metric opened

