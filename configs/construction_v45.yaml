    Among candidates passing every base gate and the three-test BH gate, select
    the highest mean cost-adjusted active return; ties follow registry order.
  if_none_pass: record all three failures and keep G sealed
  if_one_or_more_pass: freeze only the selected formula, cache hash, and gates in a separate confirmation protocol before opening G

