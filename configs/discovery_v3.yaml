experiment_id: dynamic-float-supply-discovery-v3
status: frozen_before_v3_candidate_evaluation
frozen_date: 2026-07-23
adaptive_after_v1_v2: true

candidate_registry:
  - remaining_float_inventory_fraction_025
  - remaining_float_inventory_fraction_050
  - remaining_float_inventory_fraction_100
  - remaining_float_inventory_days_025
  - remaining_float_inventory_days_050
  - remaining_float_inventory_days_100

multiplicity:
  method: Benjamini-Hochberg
  prior_candidates_included: 12
  total_candidates_after_v3: 18
  family: every directional candidate evaluated in V1 through V3 discovery

data:
  research: liquid bucket A, stable asset-hash partition, 500 stocks per month
  confirmation: liquid bucket B, asset-disjoint and unopened
  float_shares: TongdaXin point-in-time gbbq categories 5 and 9
  turnover: TongdaXin daily volume divided by point-in-time float shares
  formation_and_outcome_prices: Tencent hfq
  industry: official Shenwan historical classification, backward as-of start_date

periods:
  discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]

neutralization:
  winsorization: 3-MAD monthly cross-section
  controls:
    - z_log_float_market_cap
    - centered_squared_z_log_float_market_cap
    - Shenwan_L1_dummies
    - low_turnover_20
    - low_turnover_vol_60
    - reversal_20
    - low_volatility_60
    - float_supply_days_120
  regression: equal-weight monthly OLS residual, then z-score

research_gate:
  discovery_minimum_months: 34
  discovery_mean_rank_ic_min: 0.015
  discovery_bh_fdr_max: 0.10
  validation_minimum_months: 23
  validation_mean_rank_ic_min: 0.010
  validation_2023_and_2024_positive: true
  validation_mean_net_active_return_min: 0.0
  validation_net_information_ratio_min: 0.30
  selection: highest validation net information ratio, then validation mean IC, then name

portfolio:
  type: buffered equal-weight long-only
  holdings: 100
  retention_percentile: 0.60
  benchmark: equal-weight common formation universe
  cost_bps_one_way: 20
