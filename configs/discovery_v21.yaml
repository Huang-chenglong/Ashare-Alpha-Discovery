experiment_id: directional-range-relaxation-asymmetry-v21
status: frozen_before_v21_bucket_e_evaluation
frozen_date: 2026-07-23
research_bucket: E/legacy-liquid-hash-A
claim_type: exact completed-event range-relaxation characteristic; asymmetric volatility response is prior art

candidate_registry: [drra_60, drra_90]

data_reuse_limitation: >-
  E and F are asset-disjoint and V21 has never been evaluated on either, but these
  underlying panels were used by an earlier repository for a different factor.
  F remains sealed for V21 until a candidate passes E.

formula:
  residual_return: daily log return minus eligible-universe daily median
  tail_definition: bottom and top cross-sectional residual-return quintiles
  log_range: log(high / low)
  completed_range_response: log_range_t_plus_1 minus log_range_t, recorded at t+1
  downside_relaxation: mean completed range response after bottom-tail events
  upside_relaxation: mean completed range response after top-tail events
  candidate: upside_relaxation minus downside_relaxation
  interpretation: high values mean volatility relaxes faster after downside shocks than upside shocks
  minimum_completed_events_per_tail: 8
  horizons: [60, 90]
  expected_sign: positive

neutralization:
  minimum_rows: 100
  common_controls: eleven known liquidity, reversal, volatility, lottery, momentum, and overnight/intraday baselines
  candidate_specific_controls:
    - completed bottom-versus-top event-count balance
    - unconditional mean tail-event range response
    - linear prior-residual/range-response correlation
    - mean tail-event log range
  structural_controls:
    - z_log_float_market_cap
    - centered_squared_z_log_float_market_cap
    - point_in_time_Shenwan_L1_dummies

adaptive_reuse_disclosure: prior C/D and V20 outcomes are disclosed; E is adaptive research and F remains unopened for V21

multiplicity:
  method: Benjamini-Hochberg
  prior_tests_included: 69
  current_tests: 2
  total_tests_after_v21: 71

periods:
  discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]

research_gate:
  discovery_minimum_months: 32
  discovery_mean_rank_ic_min: 0.015
  discovery_bh_fdr_max: 0.10
  validation_minimum_months: 23
  validation_mean_rank_ic_min: 0.010
  validation_2023_and_2024_positive: true
  validation_mean_net_active_return_min: 0.0
  validation_net_information_ratio_min: 0.30

portfolio:
  type: buffered equal-weight long-only
  holdings: 100
  retention_percentile: 0.60
  cost_bps_one_way: 20

failure_rule: retain negative result and keep F closed if no candidate passes
