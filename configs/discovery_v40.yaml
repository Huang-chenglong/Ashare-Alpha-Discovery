experiment_id: customer-financing-momentum-alignment-v40
status: frozen_before_v40_bucket_e_return_evaluation
frozen_date: 2026-07-23
research_bucket: E/legacy-liquid-hash-A
claim_type: >-
  Exact positive customer-financing growth/quarterly acceleration/revenue-growth
  interaction. Advance receipts and deferred-revenue changes are prior art.

candidate_registry: [cfma_v40]
expected_sign: positive

formula:
  customer_financing: FN45 advance receipts plus 10000 times FN434 contract liabilities
  customer_financing_growth_yoy: current intensity minus four-quarter-lag intensity
  prior_quarter_customer_financing_growth_yoy: >-
    Prior-quarter intensity minus its four-quarter lag.
  customer_financing_acceleration: current YoY growth minus prior-quarter YoY growth
  revenue_growth_yoy: log current TTM revenue divided by its four-quarter lag
  transform: >-
    Strictly positive current customer-financing growth, acceleration, and
    revenue growth are separately percentile-ranked by date; nonpositive values
    receive zero.
  candidate: product of the three positive ranks

financial_data:
  source: TongdaXin professional quarterly GPCW packages
  fields: [FN40, FN45, FN283, FN307, FN308, FN314, FN434]
  history_rule: six consecutive quarterly observations through shifts one, four, and five
  point_in_time_rule: current report is usable only on FN314
  maximum_signal_age_days: 183
  excluded_shenwan_l1_codes: ["48", "49"]
  pre_outcome_coverage_audit:
    valid_quarterly_rows: 122173
    assets: 5392
    positive_customer_financing_growth_rows: 62282
    positive_acceleration_rows: 62118
    positive_revenue_growth_rows: 75408
    triple_positive_rows: 21132
    available_period: [2019-07-16, 2026-05-15]
    note: calculated without loading or joining any future-return label
  vintage_limitation: >-
    Packages were downloaded in 2026 rather than archived at each formation.
    Announcement gating is enforced, but later corrections or restatements
    cannot be ruled out.

neutralization:
  minimum_rows: 100
  known_price_volume_controls:
    - low_turnover_20
    - low_turnover_vol_60
    - reversal_20
    - low_volatility_60
    - anti_max_return_20
    - anti_max_return_60
    - anti_skewness_20
    - anti_skewness_60
    - momentum_60_20
    - momentum_120_20
    - overnight_mean_20
    - overnight_mean_60
    - negative_intraday_mean_20
    - negative_intraday_mean_60
  financial_main_effects:
    - positive_customer_financing_growth_rank
    - positive_customer_financing_acceleration_rank
    - positive_revenue_growth_rank
    - customer_financing_growth_yoy
    - prior_quarter_customer_financing_growth_yoy
    - customer_financing_acceleration
    - customer_financing_intensity
    - advance_receipts_intensity
    - contract_liabilities_intensity
    - revenue_growth_yoy
    - cash_margin
    - profitability_roa
    - cash_flow_roa
    - cash_accrual_spread
    - asset_growth_yoy
  structural_controls:
    - z_log_float_market_cap
    - centered_squared_z_log_float_market_cap
    - point_in_time_Shenwan_L1_dummies

prior_art_boundary:
  related_but_not_exact:
    - https://doi.org/10.1080/21697213.2023.2300293
    - https://doi.org/10.1108/ARA-11-2015-0118
    - https://doi.org/10.1016/j.intaccaudtax.2021.100441
  bounded_search_result: >-
    The exact second-difference interaction was not found in the bounded search,
    but its primitive customer-financing anomaly is established. The score
    removes all three rank components, current and prior growth, acceleration,
    levels, cash quality, known factors, size, and industry. Universal novelty
    is not claimed.

multiplicity:
  method: cumulative Benjamini-Hochberg on discovery one-sided HAC p-values
  prior_tests_included: 92
  current_tests: 1
  total_tests_after_v40: 93
  additional_guard: validation one-sided HAC p must be no greater than 0.05

periods:
  discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]

research_gate:
  discovery_minimum_months: 34
  discovery_mean_rank_ic_min: 0.015
  discovery_bh_fdr_max: 0.10
  validation_minimum_months: 23
  validation_mean_rank_ic_min: 0.010
  validation_2023_and_2024_positive: true
  validation_hac_p_one_sided_max: 0.05
  validation_mean_net_active_return_min: 0.0
  validation_net_information_ratio_min: 0.30

portfolio:
  type: buffered equal-weight long-only
  holdings: 100
  retention_percentile: 0.60
  cost_bps_one_way: 20

adaptive_reuse_disclosure: >-
  For the exact V40 formula, 2023-2024 is outside construction. At the project
  level E has been repeatedly inspected through V39 and is adaptively reused
  internal validation, not a pristine holdout. V40 remains in the cumulative
  93-test family.
data_reuse_limitation: F remains sealed pending every frozen research gate
failure_rule: >-
  Reject V40 without changing sign, fields, units, lags, ranks, bounds, age,
  controls, periods, gates, portfolio, or costs and keep F sealed.
