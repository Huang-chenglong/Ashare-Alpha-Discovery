experiment_id: financing-tail-spread-v54
status: frozen_after_v53_B_economic_failure_before_v54_outcomes
frozen_date: 2026-07-25

adaptivity_disclosure: >-
  V54 is adaptive to V53's independent-B result: rank IC remained positive in
  every year but the long-only top-50 implementation was cost-negative. V54
  therefore pre-registers a symmetric tail-spread target and market-neutral
  portfolio. Neither newly built bucket C nor bucket D outcome has been read.

features:
  inherited: V52 features except short-leverage and short-sale inputs
  new_financing_inputs:
    - financing_buy_to_amount
    - financing_buy_to_balance
    - financing_buy_surprise_4
  excluded_sparse_inputs:
    - short_sell_surprise_4
    - short_inventory_change_to_amount
    - short_inventory_path_4
  normalization: cross_sectional_percentile_rank_each_month
  missing_values: rows_are_excluded_no_imputation

target:
  bottom_decile: -1
  middle_eighty_percent: 0
  top_decile: 1
  model_score: probability_top_decile_minus_probability_bottom_decile

models:
  - candidate: logit_spread_v54
    specification: StandardScaler_then_balanced_LogisticRegression_C_0.1
  - candidate: hgb_spread_v54
    specification: balanced_HGB_150_iterations_7_leaves_min_leaf_40_l2_10
  - candidate: extra_spread_v54
    specification: balanced_ExtraTrees_300_depth_5_min_leaf_30_max_features_0.75
candidate_registry: [logit_spread_v54, hgb_spread_v54, extra_spread_v54]
alternative_models_or_hyperparameters_permitted_after_outcomes: false
sign_flipping_permitted_after_outcomes: false

point_in_time_training:
  construction_prediction_dates: 2021-01-01_to_2023-12-31
  train_rule: only_rows_with_exit_date_strictly_before_prediction_date
  minimum_training_rows: 2500
  final_model_label_cutoff: exit_date_strictly_before_2024-01-01
  validation_or_confirmation_refitting: none

neutralization:
  controls: ten_known_price_volume_factors_plus_linear_financing_momentum_and_path_main_effects
  size: log_float_market_cap_and_centered_square
  industry: point_in_time_shenwan_level_1
  minimum_rows_A: 150
  minimum_rows_C_D: 65

