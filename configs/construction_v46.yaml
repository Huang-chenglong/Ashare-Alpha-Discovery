experiment_id: robust-persistent-consensus-v46
status: frozen_before_E_plus_F_plus_G_construction_outcomes
frozen_date: 2026-07-24

candidates:
  - candidate: pmedian3_v46
    formula: median(consensus60_40(t), consensus60_40(t-1), consensus60_40(t-2))
  - candidate: pfloor3_v46
    formula: min(consensus60_40(t), consensus60_40(t-1), consensus60_40(t-2))
  - candidate: pstable3_v46
    formula: mean(three-month consensus60_40) - 0.50 * range(three-month consensus60_40)
base_consensus: 0.60 * percentile_rank(rrsm_v43_residual) + 0.40 * percentile_rank(tafs_v42_residual)
consecutive_months_required: 3
hypothesis: >-
  A robust ordinal core that remains high across three consecutive months is
  more portable across asset universes than a precise weighted average. Median,
  floor, and dispersion-penalized aggregation reduce dependence on any single
  transient monthly model score.
direction: higher_robust_persistent_consensus_predicts_higher_return

adaptivity_disclosure: >-
  V46 was designed after V45 failed G confirmation. E, F, and G are fully
  consumed construction data. No V46 claim is out of sample without a one-shot
  formula-unseen H confirmation.

evidence_roles:
  E: consumed adaptive construction data
  F: consumed adaptive construction data
  G: failed V45 confirmation, explicitly converted to V46 construction data
  H: sealed asset-disjoint and formula-unseen confirmation data

