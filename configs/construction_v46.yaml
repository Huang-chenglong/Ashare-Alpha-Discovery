bounded_prior_art_search:
  universal_novelty_claim: false
  boundary: >-
    Rolling medians, floors, and range penalties are general prior art. Only the
    exact application to the frozen project-specific structural-tail consensus,
    controls, gates, and sealed H workflow is claimed as project-specific.

decision_rule: >-
  H remains sealed during construction. It may be opened once, for only the
  selected frozen formula, after a construction pass and separately committed
  confirmation protocol.
