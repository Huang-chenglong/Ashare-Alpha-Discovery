experiment_id: directional-participation-dispersion-asymmetry-v9
status: frozen_before_v9_bucket_c_evaluation
frozen_date: 2026-07-23
claim_type: adaptive new primitive candidate, explicitly inspired by V8 diagnostics

candidate_registry: [dpda_60, dpda_120]

formula:
  return_state: sign of daily HFQ log return minus eligible-universe median
  participation_state: local TDX turnover fraction
  sign_specific_concentration: n_sign * sum(turnover_squared) / sum(turnover)^2
  candidate: log(negative-day concentration) minus log(positive-day concentration)
  interpretation: positive-return participation is diffuse while negative-return participation is episodic
  minimum_observations: ten positive and ten negative days
  horizons: [60, 120]
  expected_sign: positive

neutralization:
  common_controls: same eleven known baselines as V8
  candidate_specific_controls:
    - return sign balance
    - signed turnover share (OBV-like level)
    - linear excess-return/log-turnover correlation
    - same-window PDS Mann-Whitney location dominance
  structural_controls:
    - z_log_float_market_cap
    - centered_squared_z_log_float_market_cap
    - point_in_time_Shenwan_L1_dummies

adaptive_reuse_disclosure: >-
  V9 was proposed after observing V8 on bucket C. It tests a distribution-shape object,
  not a sign/horizon change to PDS. Bucket C is adaptive research data; bucket D remains
  unopened. Multiplicity includes every prior test.

multiplicity:
  method: Benjamini-Hochberg
  prior_tests_included: 52
  current_tests: 2
  total_tests_after_v9: 54

periods:
  discovery: [2020-01-01, 2022-12-31]
  internal_validation: [2023-01-01, 2024-12-31]

research_gate:
  discovery_minimum_months: 34
  discovery_mean_rank_ic_min: 0.015
  discovery_bh_fdr_max: 0.10
  validation_minimum_months: 23
  validation_mean_rank_ic_min: 0.010
  validation_2023_and_2024_positive: true
  validation_mean_net_active_return_min: 0.0
  validation_net_information_ratio_min: 0.30

selection_rule: highest validation mean rank IC among candidates passing every gate

portfolio:
  type: buffered equal-weight long-only
  holdings: 20
  retention_percentile: 0.60
  cost_bps_one_way: 20

failure_rule: retain negative result and keep D closed if no candidate passes
